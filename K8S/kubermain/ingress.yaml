apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-web-app
spec:
  ingressClassName: nginx
  rules:
  - host: go-web-app.local
    http:
      paths:
      - path: /bar
        pathType: Prefix
        backend:
          service:
            name: go-web-app
            port:
              number: 80
  - host: "*.foo.com"
    http:
      paths:
      - path: /foo
        pathType: Prefix
        backend:
          service:
            name: go-web-app
            port:
              number: 80